; PHP Optimization Settings for CharitySwimRun
; Documentation: https://www.php.net/manual/en/opcache.configuration.php

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60

; Realpath Cache: Optimizes file path resolution (very important for Docker/Windows)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache Settings: Stores precompiled script bytecode in shared memory
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8

; Increase this if your project has thousands of PHP files
opcache.max_accelerated_files=10000

; Frequency of checking file timestamps for changes (2 seconds)
opcache.revalidate_freq=2

; Set to 1 for development (checks for changes). 
; Set to 0 for production (requires manual restart to see code changes).
opcache.validate_timestamps=1

opcache.save_comments=1
opcache.fast_shutdown=1
